<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniMat AI - Material Master Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #1a365d; margin: 0; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 10px 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { background-color: #2b6cb0; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2c5282; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f7fafc; color: #4a5568; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #ebf8ff; color: #2b6cb0; text-transform: uppercase; }
        .cpse-badge { display: block; font-size: 12px; color: #4a5568; background: #edf2f7; margin: 2px 0; padding: 4px 8px; border-radius: 4px; }
        .status-badge { background: #c6f6d5; color: #22543d; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>UniMat AI</h1>
            <p style="margin: 5px 0 0 0; color: #718096;">National Material Master Registry Dashboard</p>
        </div>
        <button onclick="fetchRegistry()">🔄 Refresh Data</button>
    </header>

    <div class="card">
        <div class="controls">
            <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Search by National ID, description, or material category...">
        </div>

        <table id="registryTable">
            <thead>
                <tr>
                    <th>National Material ID</th>
                    <th>Standardized Description</th>
                    <th>Category</th>
                    <th>Mapped Legacy CPSE Codes</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="5" style="text-align: center; color: #a0aec0;">Click "Refresh Data" or check if FastAPI server is running...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'http://127.0.0.1:8000/api/national-registry';

    async function fetchRegistry() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Loading records...</td></tr>';

        try {
            const response = await fetch(API_URL);
            const result = await response.json();
            
            if (result.status === "success" && Array.isArray(result.data)) {
                renderTable(result.data);
            } else {
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">No valid records found.</td></tr>';
            }
        } catch (error) {
            console.error('Error:', error);
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Error connecting to API. Verify backend is running at http://127.0.0.1:8000.</td></tr>';
        }
    }

    function renderTable(data) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        data.forEach(item => {
            const legacyCodes = item.mapped_cpse_materials.map(m => 
                `<span class="cpse-badge"><b>${m.cpse_id}:</b> ${m.original_code} (${m.original_desc})</span>`
            ).join('');

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><b>${item.national_material_id}</b></td>
                <td style="text-transform: uppercase;">${item.standardized_description}</td>
                <td><span class="tag">${item.category}</span></td>
                <td>${legacyCodes}</td>
                <td><span class="status-badge">${item.governance.status}</span></td>
            `;
            tableBody.appendChild(row);
        });
    }

    function filterTable() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');

        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? '' : 'none';
        });
    }

    window.onload = fetchRegistry;
</script>

</body>
</html>
